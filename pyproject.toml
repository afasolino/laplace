[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-research-workspace"
version = "2.0.0"
description = "Private localhost-only research retrieval and analysis workspace"
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "defusedxml>=0.7.1", "pydantic>=2.7", "pypdf>=5.0", "fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9", "argon2-cffi>=23.1", "prompt_toolkit>=3.0.53,<4"]

[project.optional-dependencies]
v3 = ["gradio>=6.5,<7", "grep-ast==0.9.0", "mcp>=2.0,<3", "httpx2>=2.5,<3"]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "bandit>=1.7", "httpx>=0.27", "ruff>=0.8", "mypy>=1.13", "types-defusedxml>=0.7.0.20250822", "types-PyYAML>=6.0"]
docx = ["python-docx>=1.1"]
docling = ["docling>=2.0"]
browser = ["playwright>=1.40"]

[project.scripts]
research-workspace = "research_workspace.cli:main"
laplace = "research_workspace.laplace_chat_entrypoint:main"
laplace-web = "research_workspace.laplace_web:main"
laplace-ast-context = "research_workspace.ast_context:main"
laplace-zetsu-mcp = "research_workspace.zetsu_sdk_stdio:main"
laplace-zetsu-codex = "research_workspace.zetsu_codex:main"
laplace-operator = "research_workspace.operator_cli:main"
laplace-operator-server = "research_workspace.operator_server:main"
research = "research_workspace.research_cli:main"
laplace-migrate = "research_workspace.migration_cli:main"
laplace-client = "research_workspace.client_bridge:main"
laplace-maintenance = "research_workspace.maintenance_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_workspace = ["operator_web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "cross_platform_deterministic: deterministic tests supported on the current host",
    "linux_posix_required: deterministic tests requiring POSIX runtime semantics",
    "windows_privilege_required: tests blocked by Windows privilege or native policy",
    "optional_dependency: tests requiring a declared but unavailable dependency or toolchain",
    "interactive_e2e: tests requiring an interactive console or browser",
    "gpu_smoke: lightweight GPU checks that do not certify production hardware",
    "a6000_required: checks deferred to the RTX A6000 production host",
    "external_live: checks requiring an external live service or model",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["benchmarks/a6000_agent_team/paired_public"]
lint.ignore = ["EXE001"] # Repository scripts are deliberately invoked through Python, not as executables.

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["research_workspace"]

[tool.coverage.run]
branch = true
source = ["research_workspace"]

[tool.coverage.report]
show_missing = true
