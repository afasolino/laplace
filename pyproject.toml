[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-research-workspace"
version = "2.0.0"
description = "Private localhost-only research retrieval and analysis workspace"
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "defusedxml>=0.7.1", "pydantic>=2.7", "pypdf>=5.0", "fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9", "argon2-cffi>=23.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "bandit>=1.7", "httpx>=0.27", "ruff>=0.8", "mypy>=1.13", "types-defusedxml>=0.7.0.20250822", "types-PyYAML>=6.0"]
docx = ["python-docx>=1.1"]
docling = ["docling>=2.0"]
browser = ["playwright>=1.40"]

[project.scripts]
research-workspace = "research_workspace.cli:main"
laplace = "research_workspace.laplace_chat_entrypoint:main"
laplace-operator = "research_workspace.operator_cli:main"
laplace-operator-server = "research_workspace.operator_server:main"
research = "research_workspace.research_cli:main"
laplace-migrate = "research_workspace.migration_cli:main"
laplace-client = "research_workspace.client_bridge:main"
laplace-maintenance = "research_workspace.maintenance_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_workspace = ["operator_web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["benchmarks/a6000_agent_team/paired_public"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["research_workspace"]

[tool.coverage.run]
branch = true
source = ["research_workspace"]

[tool.coverage.report]
show_missing = true
