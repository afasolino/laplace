name: package-build

on:
  pull_request:
  push:
    branches: [main, "feature/**", "review/**"]

permissions:
  contents: read

jobs:
  package-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.lock
      - run: python -m pip install --disable-pip-version-check uv==0.11.28
      - run: python scripts/package_release.py --output-dir outputs/ci/package
        env:
          PYTHONPATH: src
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sanitized-package-results
          path: outputs/ci/package
          retention-days: 7
          if-no-files-found: error
