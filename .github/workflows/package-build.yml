name: package-build

on:
  pull_request:
  push:
    branches: [main, "feature/release-candidate-review-v8"]

permissions:
  contents: read

jobs:
  package-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.lock
      - run: python scripts/package_release.py --output-dir outputs/ci/package
        env:
          PYTHONPATH: src
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sanitized-package-results
          path: outputs/ci/package
          retention-days: 7
          if-no-files-found: error
