name: documentation

on:
  pull_request:
  push:
    branches: [main, "feature/release-candidate-review-v8"]

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - run: python scripts/check_documentation.py --output outputs/ci/documentation.json
        env:
          PYTHONPATH: src
      - run: python scripts/validate_ci.py --output outputs/ci/ci-validation.json
        env:
          PYTHONPATH: src
