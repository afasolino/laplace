name: documentation

on:
  pull_request:
  push:
    branches: [main, "feature/release-candidate-review-v8"]

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - run: python scripts/check_documentation.py --output outputs/ci/documentation.json
        env:
          PYTHONPATH: src
      - run: python scripts/validate_ci.py --output outputs/ci/ci-validation.json
        env:
          PYTHONPATH: src
