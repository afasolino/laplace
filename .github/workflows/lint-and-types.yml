name: lint-and-types

on:
  pull_request:
  push:
    branches: [main, "feature/release-candidate-review-v8"]

permissions:
  contents: read

jobs:
  lint-and-types:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.lock
      - run: ruff check src tests scripts
      - run: mypy --strict src/research_workspace
      - run: python -m compileall -q src tests scripts
      - run: git diff --check
