name: lint-and-types

on:
  pull_request:
  push:
    branches: [main, "feature/**", "review/**"]

permissions:
  contents: read

jobs:
  v3-integration-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.lock
      - run: python -m pip install --disable-pip-version-check ".[v3]"
      - run: python scripts/check_v3_integration.py
      - run: python -m pytest -q --strict-markers -m optional_dependency -p no:cacheprovider
        env:
          PYTHONPATH: src
          LAPLACE_FIXTURE_ONLY: "1"
          NO_PROXY: "*"
  lint-and-types:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.lock
      - run: ruff check src tests scripts
      - run: mypy --strict src/research_workspace
      - run: python -m compileall -q src tests scripts
      - run: git diff --check
