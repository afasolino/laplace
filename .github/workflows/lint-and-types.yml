name: lint-and-types

on:
  pull_request:
  push:
    branches: [main, "feature/release-candidate-review-v8"]

permissions:
  contents: read

jobs:
  lint-and-types:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.lock
      - run: ruff check src tests scripts
      - run: mypy --strict src/research_workspace
      - run: python -m compileall -q src tests scripts
      - run: git diff --check
