name: release-candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.lock
      - run: python scripts/run_release_candidate_v8_certification.py --output-root outputs/ci/release
        env:
          PYTHONPATH: src
          LAPLACE_FIXTURE_ONLY: "1"
          NO_PROXY: "*"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-v8-certification
          path: outputs/ci/release
          retention-days: 7
          if-no-files-found: error
