name: security

on:
  pull_request:
  push:
    branches: [main, "feature/release-candidate-review-v8"]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.lock
      - run: bandit -q -lll -r src/research_workspace
      - run: python -m pytest -q tests/test_auth_provenance_security.py tests/test_providers_v7.py tests/test_sync_v7.py
        env:
          PYTHONPATH: src
          LAPLACE_FIXTURE_ONLY: "1"
      - run: python scripts/run_security_checks.py --output outputs/ci/security.json
        env:
          PYTHONPATH: src
