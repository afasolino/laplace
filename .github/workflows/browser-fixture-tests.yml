name: browser-fixture-tests

on:
  pull_request:
  push:
    branches: [main, "feature/release-candidate-review-v8"]

permissions:
  contents: read

jobs:
  browser-fixture-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.lock
      - run: python -m playwright install chromium
      - run: python -m pytest -q tests/test_operator_gui_e2e.py
        env:
          PYTHONPATH: src
          LAPLACE_FIXTURE_ONLY: "1"
          NO_PROXY: "*"
