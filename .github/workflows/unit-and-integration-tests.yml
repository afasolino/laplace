name: unit-and-integration-tests

on:
  pull_request:
  push:
    branches: [main, "feature/**", "review/**"]

permissions:
  contents: read

jobs:
  unit-and-integration-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.lock
      - run: python scripts/run_ci_tests.py -- --strict-markers -m cross_platform_deterministic
        env:
          PYTHONPATH: src
          LAPLACE_FIXTURE_ONLY: "1"
          NO_PROXY: "*"
      - if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        run: python -m pytest -q --strict-markers -m linux_posix_required -p no:cacheprovider
        env:
          PYTHONPATH: src
          LAPLACE_FIXTURE_ONLY: "1"
          NO_PROXY: "*"
      - if: matrix.os == 'windows-2025' && matrix.python == '3.12'
        run: >-
          python -m pytest -q --strict-markers -m cross_platform_deterministic
          --cov=research_workspace --cov-branch --cov-fail-under=63.6
          --cov-report=term-missing -p no:cacheprovider
        env:
          PYTHONPATH: src
          LAPLACE_FIXTURE_ONLY: "1"
          NO_PROXY: "*"
